# YOLOv11 Segmentation Training Configuration
# Fish Freshness Detection Project
# -----------------------------------------------

# Model
model: "yolov11n-seg.pt"   # Pretrained weights (n/s/m/l/x variants)
task: "segment"

# Dataset
data: null  # Override via --data flag or set path here

# Training Hyperparameters
epochs: 100
batch: 16
imgsz: 640
workers: 8
device: "0"                # GPU index or "cpu"
amp: true                  # Automatic Mixed Precision
patience: 50               # Early stopping patience

# Optimizer
optimizer: "auto"          # auto | SGD, Adam, AdamW
lr0: 0.01                  # Initial learning rate
lrf: 0.01                  # Final learning rate factor (lr0 * lrf)
momentum: 0.937
weight_decay: 0.0005
cos_lr: true               # Cosine LR scheduler

# Augmentation
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0                # Mosaic augmentation probability
mixup: 0.2                 # Mixup augmentation probability
copy_paste: 0.0

# Data Loading
cache: false               # Use cache: true for small datasets to speed up training
rect: false                # Rectangular training
multi_scale: false

# Saving & Logging
project: "runs/segment"
name: "fish_freshness_train"
exist_ok: true
save_period: 10            # Save checkpoint every N epochs (-1 to disable)
plots: true                # Save training plots

# Logging Services
tensorboard: false         # Enable TensorBoard logging
wandb: false               # Enable Weights & Biases logging

# Validation
val: true
split: "val"               # Dataset split for validation

# Export (post-training)
export_format: null        # Set to "onnx", "engine", etc. to export after training